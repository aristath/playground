name = "playground-plugin-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Development settings
[dev]
port = 5264
local_protocol = "http"

# Staging environment
[env.staging]
name = "playground-plugin-proxy-staging"

# Production environment
[env.production]
name = "playground-plugin-proxy-production"

# Note: GITHUB_TOKEN must be set as a secret using:
# wrangler secret put GITHUB_TOKEN --env production
